# Arquivo de Configuração - Exemplo de Otimização com PDE
# Este arquivo contém parâmetros padrão e configurações para os exemplos

[MODELO_COMPLETO]
# Parâmetros físicos da partícula
RAIO_PARTICULA = 0.001          # Raio da partícula esférica (m)
DENSIDADE_PARTICULA = 1500.0    # Densidade da partícula (kg/m³)
POROSIDADE = 0.4                # Porosidade da partícula (-)

# Parâmetros de transporte
DIFUSIVIDADE_INICIAL = 1e-10    # Difusividade efetiva inicial (m²/s)
COEF_TRANSFERENCIA_MASSA = 1e-5 # Coeficiente de transferência externa (m/s)

# Parâmetros de adsorção (Langmuir)
CONSTANTE_LANGMUIR_INICIAL = 100.0   # Constante de Langmuir inicial (m³/kg)
CAPACIDADE_MAXIMA_INICIAL = 0.5      # Capacidade máxima inicial (kg/kg)

# Condições operacionais
CONCENTRACAO_INICIAL = 1.0      # Concentração inicial externa (kg/m³)
TEMPO_FINAL = 3600.0           # Tempo final de simulação (s)
PASSO_TEMPO = 10.0             # Passo de tempo (s)

# Discretização espacial
NUMERO_PONTOS_RADIAIS = 50     # Número de pontos na direção radial

# Parâmetros de otimização
TOLERANCIA_CONVERGENCIA = 1e-6  # Tolerância para convergência
MAX_ITERACOES = 100             # Máximo de iterações

[MODELO_SIMPLIFICADO]
# Parâmetros cinéticos
K1_INICIAL = 0.1               # Constante de adsorção inicial (1/s)
K2_INICIAL = 0.001             # Constante de dessorção inicial (1/s)
Q_MAX_INICIAL = 50.0           # Capacidade máxima inicial (mg/g)
C0_INICIAL = 100.0             # Concentração inicial (mg/L)

# Simulação
TEMPO_FINAL_SIMPLES = 300.0    # Tempo final (s)
PASSO_TEMPO_SIMPLES = 1.0      # Passo de tempo (s)

# Grid Search
K1_MIN = 0.01                  # Valor mínimo para k1
K1_MAX = 0.5                   # Valor máximo para k1
K2_MIN = 0.0001                # Valor mínimo para k2
K2_MAX = 0.05                  # Valor máximo para k2
Q_MAX_MIN = 20.0               # Valor mínimo para q_max
Q_MAX_MAX = 60.0               # Valor máximo para q_max

[DADOS_SINTETICOS]
# Geração de dados experimentais sintéticos
RUIDO_PERCENTUAL = 5.0         # Percentual de ruído nos dados (%)
NUMERO_PONTOS_EXP = 30         # Número de pontos experimentais
INTERVALO_AMOSTRAGEM = 10      # Intervalo entre pontos (cada N pontos simulados)

[ARQUIVOS_SAIDA]
# Nomes dos arquivos de saída
DADOS_EXP_COMPLETO = "dados_experimentais.csv"
DADOS_EXP_SIMPLES = "dados_experimentais_simples.csv"
SIM_INICIAL_COMPLETO = "simulacao_inicial.csv"
SIM_INICIAL_SIMPLES = "simulacao_inicial_simples.csv"
SIM_OTIMIZADA_COMPLETO = "simulacao_otimizada.csv"
SIM_OTIMIZADA_SIMPLES = "simulacao_otimizada_simples.csv"
COMPARACAO_COMPLETO = "comparacao_resultados.csv"
COMPARACAO_SIMPLES = "comparacao_simples.csv"

[VISUALIZACAO]
# Configurações para plotagem (referência)
FORMATO_GRAFICO = "PNG"
DPI_SAIDA = 300
TAMANHO_FIGURA = "10x6"
CORES_PADRAO = ["blue", "red", "green", "orange"]
ESTILO_LINHA_EXP = "o"
ESTILO_LINHA_SIM = "-"

# Comentários:
# - Este arquivo serve como referência para os parâmetros utilizados
# - Os valores podem ser modificados diretamente no código fonte
# - Para implementação futura: parser de configuração em C++
# - Formatos suportados: CSV para dados, PNG/PDF para gráficos